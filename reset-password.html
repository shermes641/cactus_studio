<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Cactus Studio</title>
    <link rel="stylesheet" href="/site.css">
</head>
<body class="auth-page-body">
    <div class="lang-switch-container">
        <button id="lang-btn" onclick="toggleLang()" class="lang-switch-btn">ES</button>
    </div>
    <div class="auth-card">
        <h1 id="title" class="auth-title">Set New Password</h1>
        <form id="reset-form" onsubmit="event.preventDefault(); submitReset();">
            <!-- Hidden username field for accessibility -->
            <input type="text" id="hidden-username" autocomplete="username" style="display:none;" aria-hidden="true">
            <div style="position: relative; margin-bottom: 10px;">
                <input type="password" id="new-pass" class="auth-input" placeholder="New Password (min 8 chars)" required autocomplete="new-password" style="padding-right: 40px; width: 100%; margin-bottom: 0;">
                <span id="new-pass-toggle" onclick="toggleVisibility('new-pass', 'new-pass-toggle')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none; font-size: 1.2em;">👁️</span>
            </div>
            <small style="color: #666; display: block; margin-bottom: 10px; font-size: 0.8em;">Password must be at least 8 characters, with 1 uppercase, 1 number, and 1 special char</small>
            <div style="position: relative; margin-bottom: 15px;">
                <input type="password" id="confirm-pass" class="auth-input" placeholder="Confirm Password" required autocomplete="new-password" style="padding-right: 40px; width: 100%; margin-bottom: 0;">
                <span id="confirm-pass-toggle" onclick="toggleVisibility('confirm-pass', 'confirm-pass-toggle')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none; font-size: 1.2em;">👁️</span>
            </div>
            <button type="submit" class="btn auth-btn" id="submit-btn">Reset Password</button>
            <div id="message"></div>
        </form>
        <a href="/" id="back-btn" class="back-link">Back to Home</a>
    </div>

    <script>
        const translations = {
            en: {
                title: "Set New Password",
                phNew: "New Password (min 8 chars)",
                phConfirm: "Confirm Password",
                btn: "Reset Password",
                back: "Back to Home",
                invalidParams: "Invalid link parameters. Redirecting to login...",
                expired: "Invalid or expired link",
                short: "Password must be at least 6 characters.",
                mismatch: "Passwords do not match.",
                processing: "Processing...",
                success: "Password reset successfully! You can now login.",
                failed: "Failed to reset password.",
                network: "Network error."
            },
            es: {
                title: "Nueva Contraseña",
                phNew: "Nueva Contraseña (min 8 carácteres)",
                phConfirm: "Confirmar Contraseña",
                btn: "Restablecer",
                back: "Volver al Inicio",
                invalidParams: "Parámetros inválidos. Redirigiendo...",
                expired: "Enlace inválido o expirado",
                short: "La contraseña debe tener al menos 6 carácteres.",
                mismatch: "Las contraseñas no coinciden.",
                processing: "Procesando...",
                success: "¡Contraseña restablecida! Ahora puedes iniciar sesión.",
                failed: "Error al restablecer contraseña.",
                network: "Error de red."
            }
        };
        let lang = localStorage.getItem('cactusLang') || 'en';
        const t = translations[lang];

        function toggleLang() {
            lang = lang === 'en' ? 'es' : 'en';
            localStorage.setItem('cactusLang', lang);
            location.reload();
        }

        // Apply translations
        document.getElementById('lang-btn').innerText = lang === 'en' ? 'ES' : 'EN';
        document.getElementById('title').innerText = t.title;
        document.getElementById('new-pass').placeholder = t.phNew;
        document.getElementById('confirm-pass').placeholder = t.phConfirm;
        document.getElementById('submit-btn').innerText = t.btn;
        document.getElementById('back-btn').innerText = t.back;

        function toggleVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.innerText = "🙈";
            } else {
                input.type = "password";
                icon.innerText = "👁️";
            }
        }

        (async function checkToken() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const email = params.get('email');
            const msg = document.getElementById('message');
            const btn = document.getElementById('submit-btn');
            const inputs = document.querySelectorAll('input');

            // Populate hidden username
            if (email) document.getElementById('hidden-username').value = email;

            if (!token || !email) {
                msg.innerText = t.invalidParams;
                msg.className = "fatal-error";
                btn.disabled = true;
                inputs.forEach(i => i.disabled = true);
                setTimeout(() => window.location.href = '/', 3000);
                return;
            }

            try {
                const res = await fetch('/.netlify/functions/check-reset-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, token })
                });
                
                if (!res.ok) {
                    const data = await res.json();
                    msg.innerText = (data.error || t.expired) + ". Redirecting to login...";
                    msg.className = "fatal-error";
                    btn.disabled = true;
                    inputs.forEach(i => i.disabled = true);
                    setTimeout(() => window.location.href = '/', 3000);
                }
            } catch (e) { console.error(e); }
        })();

        async function submitReset() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const email = params.get('email');
            const pass = document.getElementById('new-pass').value;
            const confirm = document.getElementById('confirm-pass').value;
            const msg = document.getElementById('message');
            const btn = document.getElementById('submit-btn');

            if (!token || !email) {
                msg.innerText = t.invalidParams;
                msg.className = "text-error-msg";
                return;
            }

            if (pass.length < 6) {
                msg.innerText = t.short;
                msg.className = "text-error-msg";
                return;
            }

            if (pass !== confirm) {
                msg.innerText = t.mismatch;
                msg.className = "text-error-msg";
                return;
            }

            btn.disabled = true;
            btn.innerText = t.processing;
            msg.innerText = "";

            try {
                const res = await fetch('/.netlify/functions/reset-password-submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, token, newPassword: pass })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    msg.innerText = t.success;
                    msg.className = "text-success-msg";
                    document.getElementById('reset-form').reset();
                    setTimeout(() => window.location.href = '/', 2000);
                } else {
                    msg.innerText = data.error || t.failed;
                    msg.className = "text-error-msg";
                    btn.disabled = false;
                    btn.innerText = t.btn;
                }
            } catch (e) {
                msg.innerText = t.network;
                msg.className = "text-error-msg";
                btn.disabled = false;
                btn.innerText = t.btn;
            }
        }
    </script>
</body>
</html>
