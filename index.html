<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Cactus Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Navigation -->
    <header>
      <div class="logo">🌵 Cactus Studio</div>
      <div class="nav-links">
        <!-- This button is now HIDDEN by default -->
        <button
          id="admin-btn"
          onclick="toggleAdminModal()"
          style="display: none; min-width: 100px;"
        >
          Add Item
        </button>
        <button
          id="hidden-mgr-btn"
          class="add-btn"
          onclick="openHiddenManager()"
          style="background: grey; display: none; max-width: 85px;"
        >
          Hidden
          <span id="hidden-count" class="cart-count"></span>
        </button>

        <button onclick="toggleCart()">
          Cart
          <span id="cart-count" class="cart-count">0</span>
        </button>
      </div>
    </header>

    <!-- Logout Button (Hidden by default) -->
    <button id="logout-btn" onclick="logoutUser()">Logout</button>

    <!-- Hero Section -->
    <div class="hero">
      <h1>Rare & Exotic Cacti</h1>
      <p>Delivered safely from our nursery to your doorstep.</p>
    </div>

    <!-- Main Inventory -->
    <div class="container">
      <h2 class="section-title">Current Inventory</h2>
      <div class="product-grid" id="product-grid">
        <!-- Products will be injected here by JavaScript -->
      </div>
    </div>

    <!-- Admin Upload Modal -->
    <div class="modal" id="admin-modal">
      <div class="modal-content">
        <span class="close-btn" onclick="toggleAdminModal()">&times;</span>
        <h2>Upload New Cactus</h2>
        <div class="form-group">
          <label>Cactus Name</label>
          <input type="text" id="new-name" placeholder="e.g. Golden Barrel" />
        </div>
        <div class="form-group">
          <label>Price ($)</label>
          <input type="number" id="new-price" placeholder="25.00" />
        </div>
        <div class="form-group">
          <label>Image URL</label>
          <input
            type="text"
            id="new-image"
            placeholder="Paste image link here"
          />
          <div id="vis-container">
            <label><input type="checkbox" id="hide-check"> Hide Product</label>
          </div>
          <small class="helper-text"
            >(For demo, right click any image on Google Images and 'Copy Image
            Address')</small
          >
        </div>
        <div id="admin-btn-row">
            <button class="add-btn" onclick="addProduct()">Add to Inventory</button>
            <button class="add-btn cancel-btn" onclick="toggleAdminModal()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Hidden Manager Modal -->
    <div id="hidden-modal">
      <div class="hidden-modal-content">
        <h3>Hidden Products</h3>
        <div id="hidden-list"></div>
        <div class="hidden-modal-actions">
          <button onclick="closeHiddenManager()" class="add-btn cancel-btn">Cancel</button>
          <button onclick="saveHiddenChanges()" class="add-btn">Save</button>
        </div>
      </div>
    </div>

    <!-- Login Modal -->
    <form id="login-modal" onsubmit="event.preventDefault(); loginUser()">
        <h2>Cactus Shop Login</h2>
        <input type="text" id="login-phone" placeholder="Enter WhatsApp Number">
        <button type="submit" id="login-btn">Login</button>
    </form>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cart-sidebar">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <h2>Your Cart</h2>
        <span style="cursor: pointer; font-size: 1.5rem" onclick="toggleCart()"
          >&times;</span
        >
      </div>
      <div class="cart-items" id="cart-items">
        <p>Your cart is empty.</p>
      </div>
      <div id="cart-footer" style="display: none">
        <h3 style="text-align: right">
          Total: $<span id="cart-total">0.00</span>
        </h3>
        <button class="checkout-btn" onclick="checkout()">
          Proceed to Checkout
        </button>
      </div>
    </div>

    <script src="/script.js"></script>
    <!-- Full Screen Image Modal -->
    <div id="image-modal" onclick="closeImageModal()">
      <img id="modal-img" src="" alt="Zoomed Cactus" />
      <!-- stops propagation only to allow the specific add function to run first, then bubble to close -->
      <button id="modal-add-btn">Add to Cart +</button>
    </div>
  </body>
</html>
