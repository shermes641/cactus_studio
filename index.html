<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover" />
    <title>The Cactus Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Navigation -->
    <header>
      <div class="logo">🌵 Cactus Studio
      <button id="logout-btn" onclick="logoutUser()" data-i18n="logout">Logout</button>
      </div>
      <div class="nav-links">
        <button id="lang-btn" onclick="toggleLanguage()">ES</button>
        <!-- This button is now HIDDEN by default -->
        <button
          id="admin-btn"
          onclick="toggleAdminModal()"
          style="display: none; min-width: 100px;" data-i18n="addItem"
        >
          Add Item
        </button>
        <button
          id="hidden-mgr-btn"
          class="add-btn"
          onclick="openHiddenManager()"
          style="background: grey; display: none; max-width: 85px;"
        >
          <span data-i18n="hidden">Hidden</span>
          <span id="hidden-count" class="cart-count"></span>
        </button>

        <button id="help-btn" onclick="toggleHelp()" data-i18n="help">Help</button>
        <button id="cart-toggle-btn" onclick="toggleCart()">
          <span data-i18n="cart">Cart</span>
          <span id="cart-count" class="cart-count">0</span>
        </button>
      </div>
    </header>

    <!-- Hero Section -->
    <div class="hero">
      <h1 data-i18n="heroTitle">Rare & Exotic Cacti</h1>
      <p data-i18n="heroSubtitle">Delivered safely from our nursery to your doorstep.</p>
    </div>

    <!-- Main Inventory -->
    <div class="container">
      <div class="product-grid" id="product-grid">
        <!-- Products will be injected here by JavaScript -->
      </div>
      <div id="pagination-controls" class="pagination-container"></div>
    </div>

    <!-- Admin Upload Modal -->
    <div class="modal" id="admin-modal">
      <div class="modal-content">
        <span class="close-btn" onclick="toggleAdminModal()">&times;</span>
        <h2 data-i18n="uploadTitle">Upload New Cactus</h2>
        <div class="form-group">
          <label data-i18n="labelName">Cactus Name</label>
          <input type="text" id="new-name" placeholder="e.g. Golden Barrel" />
        </div>
        <div class="form-group">
          <label data-i18n="labelPrice">Price ($)</label>
          <input type="number" id="new-price" placeholder="25.00" />
        </div>
        <div class="form-group">
          <label data-i18n="labelImage">Image URL</label>
          <input
            type="text"
            id="new-image"
            placeholder="Paste image link here"
          />
          <div id="vis-container">
            <label style="display: flex; align-items: center; gap: 2px;"><input type="checkbox" id="hide-check"> <span data-i18n="labelHide">Hide Product</span></label>
          </div>
          <small class="helper-text" data-i18n="helperText"
            >(For demo, right click any image on Google Images and 'Copy Image
            Address')</small
          >
        </div>
        <div id="admin-btn-row">
            <button class="add-btn" onclick="addProduct()" data-i18n="btnAddInventory">Add to Inventory</button>
            <button class="add-btn cancel-btn" onclick="toggleAdminModal()" data-i18n="btnCancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Help Dialog -->
    <div id="help-dialog" style="display: none; position: fixed; top: 80px; right: 20px; width: 300px; background: white; border: 1px solid #ccc; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 2000;">
      <span onclick="toggleHelp()" style="position: absolute; top: 5px; right: 10px; color: red; cursor: pointer; font-weight: bold; font-size: 1.2rem;">&times;</span>
      <h3 style="margin-top: 0; position: static; width: 25%" class="version-tag" data-i18n="help">Help</h3>
      <div id="help-content" style="white-space: pre-wrap; max-height: 400px; overflow-y: auto;">Loading...</div>
    </div>

    <!-- Hidden Manager Modal -->
    <div id="hidden-modal">
      <div class="hidden-modal-content">
        <h3 data-i18n="hiddenTitle">Hidden Products</h3>
        <div id="hidden-list"></div>
        <div class="hidden-modal-actions">
          <button onclick="closeHiddenManager()" class="add-btn cancel-btn" data-i18n="btnCancel">Cancel</button>
          <button onclick="saveHiddenChanges()" class="add-btn" data-i18n="btnSave">Save</button>
        </div>
      </div>
    </div>

    <!-- Login Modal -->
    <form id="login-modal" onsubmit="event.preventDefault(); loginUser()" style="background: linear-gradient(rgba(220, 255, 220, 0.3), rgba(220, 255, 220, 0.9)), url('https://commons.wikimedia.org/wiki/Special:FilePath/Echinocactus_grusonii.jpg?width=500'); background-size: cover; background-position: center;">
        <h1 data-i18n="loginTitle">Cactus Studio Login</h1>
        <input type="text" id="login-phone" placeholder="Enter WhatsApp Number" data-i18n-placeholder="loginPlaceholder">
        <button type="submit" id="login-btn" data-i18n="btnLogin">Login</button>
        <div class="version-tag"></div>
    </form>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cart-sidebar">
      <div class="cart-header">
        <h2 data-i18n="cartTitle">CART</h2>
        <div class="cart-header-buttons">
          <button class="remove-all-btn" onclick="removeAllFromCart()" data-i18n="btnRemoveAll">Remove All</button>
          <button class="checkout-btn" onclick="checkout()" data-i18n="btnCheckout">Checkout</button>
        </div>
        <span style="cursor: pointer; font-size: 1.5rem" onclick="toggleCart()"
          >&times;</span
        >
      </div>
      <div class="cart-items" id="cart-items">
        <p data-i18n="cartEmpty">Your cart is empty.</p>
      </div>
      <div id="cart-footer" style="display: none">
        <h3 style="text-align: right">
          <span data-i18n="cartTotal">Total:</span> $<span id="cart-total">0.00</span>
        </h3>
        <div id="paypal-button-container" style="margin-top: 15px;"></div>
      </div>
    </div>

    <script src="/script.js"></script>
    <!-- Full Screen Image Modal -->
    <div id="image-modal" onclick="closeImageModal()">
      <img id="modal-img" src="" alt="Zoomed Cactus" />
      <!-- stops propagation only to allow the specific add function to run first, then bubble to close -->
      <button id="modal-add-btn" data-i18n="modalAddCart">Add to Cart +</button>
    </div>

    <!-- Version Tag -->
    <div class="version-tag"></div>
  </body>
</html>
